<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Homepage - GULA</title>
</head>
<body>

    <!-- Sidebar -->

    <div class="sidebar">
        <a href="#" class="logo">
            <i class="bx bx-menu"><box-icon type='solid' name='coffee-bean'></box-icon></i>
            <div class="logo-name"><span>Gula</span>Web</div>
        </a>
        <ul class="side-menu">
            <Li><a href="#"><i class="bx bx-menu"><box-icon name='home-alt' ></box-icon></i>Inicio</a></Li>
            <Li><a href="#"><i class="bx bx-menu"><box-icon name='package'  type='solid'></box-icon></i>Estoque</a></Li>
            <Li class="active"><a href="#"><i class="bx bx-menu"><box-icon name='line-chart' ></box-icon></i>Gráfico</a></Li>
            <Li><a href="#"><i class="bx bx-menu"><box-icon name='cog' ></box-icon></i>Configurações</a></Li>
            <li><a href="#"><i class="bx bx-menu"><box-icon name='bell' ></box-icon></i>Notificações</a></li>
        </ul>
        <ul class="side-menu">
            <Li><a href="#"><i class="bx bx-menu"><box-icon name='log-out-circle' ></box-icon></i>Deslogar</a></Li> 
        </ul>
    </div>
    
    <!-- Sidebar end -->

    <!-- Navbar -->
    <div class="content">
        <nav>
            <i class="bx bx-menu"><box-icon name='menu'></box-icon></i>
            <form action="#">
                <div class="form-input">
                    <input type="search" placeholder="Pesquisar...">
                    <button class="search-btn" type="submit"><i class="bx bx-menu"><box-icon name='search-alt-2'></box-icon></i></button>
                </div>
            </form>
            <input type="checkbox" id="theme-toggle" hidden>
            <label for="theme-toggle"></label>
            <a href="#" class="profile">
                <img src="images/logo.png">
            </a>
        </nav>
    </div>
    
    <!-- Navbar end -->

    <script src="index.js"></script>
</body>

</html>
